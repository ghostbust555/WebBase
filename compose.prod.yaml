# PROD: the copy real people use. Started by ./deploy.sh.
#
#   app          the production image (website + API in one), on 127.0.0.1:8080
#   cloudflared  only when ./tunnel.sh on: carries your domain to `app`
#   db           PostgreSQL on this computer - in compose.prod-db.yaml, used
#                unless PROD_DATABASE_URL in .env.local names a managed
#                database instead (docs/DEPLOYING.md, "A managed database")
#
# Unlike development this runs a built image, not your source folder: what
# you deployed keeps running exactly as it was, whatever you edit next.
name: webbase-prod

services:
  app:
    image: webbase-app:prod
    environment:
      App__Environment: prod
      App__Name: ${APP_NAME:-WebBase}
      # A managed database, if you use one. Empty = the db container
      # (compose.prod-db.yaml sets the connection instead).
      DATABASE_URL: ${PROD_DATABASE_URL:-}
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env.local (./setup.sh does this)}
      Auth__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Auth__AuthorEmails: ${AUTHOR_EMAILS:-}
      # Behind the Cloudflare tunnel, who a visitor is comes in this header (for
      # the per-address limits). Safe here: the port above is this computer only.
      RateLimits__ClientIpHeader: ${CLIENT_IP_HEADER:-CF-Connecting-IP}
      # The CMS. With Source files, its pages are inside the image (content/
      # as of the release); with s3 or azure, they're read from there live.
      Cms__Enabled: ${CMS_ENABLED:-false}
      Cms__Source: ${CMS_SOURCE:-files}
      Cms__S3__Bucket: ${CMS_S3_BUCKET:-}
      Cms__S3__Prefix: ${CMS_S3_PREFIX:-}
      Cms__S3__Region: ${CMS_S3_REGION:-}
      Cms__S3__ServiceUrl: ${CMS_S3_SERVICE_URL:-}
      Cms__S3__AccessKey: ${CMS_S3_ACCESS_KEY:-}
      Cms__S3__SecretKey: ${CMS_S3_SECRET_KEY:-}
      Cms__Azure__ConnectionString: ${CMS_AZURE_CONNECTION_STRING:-}
      Cms__Azure__Container: ${CMS_AZURE_CONTAINER:-}
      Cms__Azure__ContainerUrl: ${CMS_AZURE_CONTAINER_URL:-}
      Cms__Azure__Prefix: ${CMS_AZURE_PREFIX:-}
      Cms__Gcs__Bucket: ${CMS_GCS_BUCKET:-}
      Cms__Gcs__Prefix: ${CMS_GCS_PREFIX:-}
      # Request limits (docs/CONFIGURATION.md). Empty = the defaults.
      Abuse__PerIpPerMinute: ${ABUSE_PER_IP_PER_MINUTE:-}
      Abuse__BanMinutes: ${ABUSE_BAN_MINUTES:-}
      Abuse__TotalPerMinute: ${ABUSE_TOTAL_PER_MINUTE:-}
    ports:
      # This computer only. The public reaches it through the tunnel below.
      - "127.0.0.1:${PROD_PORT:-8080}:8080"
    restart: unless-stopped

  # Started only by ./tunnel.sh on (the "tunnel" profile), so going public is
  # always a deliberate act. It dials out to Cloudflare - no router ports are
  # opened. Which domain points here, and at what, is set in Cloudflare's
  # dashboard: the service there must be http://app:8080 and nothing else.
  cloudflared:
    image: cloudflare/cloudflared:2026.8.3
    profiles: ["tunnel"]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - app
    restart: unless-stopped
