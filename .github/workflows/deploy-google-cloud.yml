# Deploy to Google Cloud Run after the tests pass on main. Does nothing until
# ./scripts/cloud/gcp.sh github has connected this repository (it sets the
# GCP_* repository variables). docs/GOOGLE_CLOUD.md.
#
# No keys: GitHub proves to Google which repository this run belongs to
# (Workload Identity Federation), and Google lets exactly that one deploy.
name: Deploy to Google Cloud

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  # Actions -> Deploy to Google Cloud -> Run workflow: deploy main now.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # lets the job ask GitHub for its identity token

# One deploy at a time; a newer one waits rather than racing.
concurrency:
  group: deploy-google-cloud
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.GCP_PROJECT != '' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit the tests passed on, not whatever main is by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Build, upload and roll out
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_REGION: ${{ vars.GCP_REGION }}
        run: |
          ./scripts/cloud/gcp.sh deploy
          echo "Deployed: $(./scripts/cloud/gcp.sh url)" >> "$GITHUB_STEP_SUMMARY"
