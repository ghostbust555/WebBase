# Every check (./scripts/test.sh): the C# tests of the app and every module,
# the generated types, the website's build. Only when asked: pushing doesn't
# run it, so a push to main goes straight to the image and the deploy.
#   Actions -> Tests -> Run workflow (pick the branch), or
#   gh workflow run Tests --ref <branch>   (then: gh run watch)
# Handy when you work without Docker, e.g. from Claude Code on the web.
name: Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/test.sh
