# Every check (./scripts/test.sh) on every push and pull request: the C# tests
# of the app and every module, the generated types, the website's build.
# Handy when you work without Docker, e.g. from Claude Code on the web: push
# a branch and read the result here (or `gh run watch`).
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/test.sh
