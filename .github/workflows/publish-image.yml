# Build the production image on every push to main, and store it in
# GitHub's own container registry (ghcr.io, free), tagged with the commit:
#   ghcr.io/<owner>/webbase:sha-<12 characters of the commit>, and :latest
# ./scripts/cloud/azure.sh runs it from there (docs/AZURE.md), and any host
# that runs a container image can (docs/CLOUD.md).
#
# The image has both database modules, PostgreSQL and Cosmos DB, so one image
# serves either: Database__Provider picks (docs/MODULES.md). The package is
# private when the repository is; a host pulls it with a token that may only
# read packages.
#
# Then, once ./scripts/cloud/azure.sh github has connected this repository to
# Azure (it sets the AZURE_* repository variables), the deploy job rolls the new
# image out to Azure Container Apps. No keys: GitHub proves to Azure which
# repository and branch this run belongs to, and Azure lets exactly that deploy.
name: Publish image

# The tests don't run first: they run only when asked (tests.yml). The image
# build still type-checks and builds the website, so a broken client stops here.
on:
  push:
    branches: [main]
  # Actions -> Publish image -> Run workflow: publish main now.
  workflow_dispatch:

permissions:
  contents: read
  packages: write  # push to this repository's package on ghcr.io

concurrency:
  group: publish-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        env:
          DB_MODULE: postgres cosmos
          IMAGE_SOURCE: https://github.com/${{ github.repository }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/webbase"
          ./scripts/cloud/push-image.sh "$image"
          echo "Published ${image}:sha-$(git rev-parse --short=12 HEAD)" >> "$GITHUB_STEP_SUMMARY"
      # Keep the newest 10 versions and delete older ones: enough to roll back,
      # and the package stays small however often you push.
      - uses: actions/delete-package-versions@v5
        with:
          package-name: webbase
          package-type: container
          min-versions-to-keep: 10

  deploy:
    needs: publish
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write  # lets the job ask GitHub for its identity token, which Azure checks
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}  # the commit publish built, not whatever main is by now
      # Not a secret: which repository and branch this run is, as Azure will see it.
      # azure.sh github must trust exactly this; the summary says how if it doesn't.
      - name: Show the identity this run presents to Azure
        run: |
          token="$(curl -fsS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" | jq -r .value)"
          sub="$(jq -Rr 'split(".")[1] | gsub("-";"+") | gsub("_";"/") | (. + ("=" * ((4 - length % 4) % 4))) | @base64d | fromjson | .sub' <<<"$token")"
          echo "Azure must trust: $sub"
          {
            echo "Azure must trust the subject \`$sub\`."
            echo "If the login below fails with AADSTS700213, run in Azure Cloud Shell:"
            echo "\`GITHUB_OIDC_SUBJECT='$sub' ./scripts/cloud/azure.sh github\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Roll out to Azure Container Apps
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          ./scripts/cloud/azure.sh deploy
          echo "Deployed: $(./scripts/cloud/azure.sh url)" >> "$GITHUB_STEP_SUMMARY"
